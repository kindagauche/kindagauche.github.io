        * {

        body {
            background-color: #000000;

            font-family: "Courier New", Courier, monospace;
            overflow-x: hidden;

        .spinner {
            position: fixed;
            top: 120px;
            left: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #00ff80;
            z-index: 100;
            letter-spacing: 6px;
            font-family: "Courier New", "Courier", monospace;
            text-transform: uppercase;
            animation: tvStatic 0.08s infinite steps(10);
            transform: rotate(-90deg);
        }

        @keyframes tvStatic {
            0% {
                text-shadow: 
                    1px 0 0 rgba(255, 0, 255, 0.3),
                    -1px 0 0 rgba(0, 255, 255, 0.3),
                    0 0 10px #00ff80;
                filter: brightness(1.1) contrast(1.2);
            }
            10% {
                text-shadow: 
                    -1px 1px 0 rgba(255, 0, 255, 0.4),
                    1px -1px 0 rgba(0, 255, 255, 0.2),
                    0 0 8px #00ff80;
                filter: brightness(0.9) contrast(1.3);
            }
            20% {
                text-shadow: 
                    2px 0 0 rgba(255, 0, 255, 0.2),
                    -2px 0 0 rgba(0, 255, 255, 0.4),
                    0 0 12px #00ff80;
                filter: brightness(1.2) contrast(1.1);
            }
            30% {
                text-shadow: 
                    0 -1px 0 rgba(255, 0, 255, 0.3),
                    0 1px 0 rgba(0, 255, 255, 0.3),
                    0 0 9px #00ff80;
                filter: brightness(1.0) contrast(1.4);
            }
            40% {
                text-shadow: 
                    -2px 0 0 rgba(255, 0, 255, 0.4),
                    2px 1px 0 rgba(0, 255, 255, 0.2),
                    0 0 11px #00ff80;
                filter: brightness(0.95) contrast(1.2);
            }
            50% {
                text-shadow: 
                    1px -1px 0 rgba(255, 0, 255, 0.2),
                    -1px 1px 0 rgba(0, 255, 255, 0.4),
                    0 0 10px #00ff80;
                filter: brightness(1.15) contrast(1.1);
            }
            60% {
                text-shadow: 
                    0 2px 0 rgba(255, 0, 255, 0.3),
                    0 -1px 0 rgba(0, 255, 255, 0.3),
                    0 0 8px #00ff80;
                filter: brightness(0.85) contrast(1.3);
            }
            70% {
                text-shadow: 
                    2px 1px 0 rgba(255, 0, 255, 0.4),
                    -1px 0 0 rgba(0, 255, 255, 0.2),
                    0 0 12px #00ff80;
                filter: brightness(1.1) contrast(1.2);
            }
            80% {
                text-shadow: 
                    -1px -1px 0 rgba(255, 0, 255, 0.2),
                    1px 1px 0 rgba(0, 255, 255, 0.4),
                    0 0 9px #00ff80;
                filter: brightness(1.0) contrast(1.4);
            }
            90% {
                text-shadow: 
                    1px 1px 0 rgba(255, 0, 255, 0.3),
                    -2px 0 0 rgba(0, 255, 255, 0.3),
                    0 0 11px #00ff80;
                filter: brightness(0.9) contrast(1.1);
            }
            100% {
                text-shadow: 
                    0 0 0 rgba(255, 0, 255, 0.3),
                    0 0 0 rgba(0, 255, 255, 0.3),
                    0 0 10px #00ff80;
                filter: brightness(1.05) contrast(1.2);
            }
        }

        /* Windows 95 Style Modal */
        .win95-window {
            display: none;
            position: fixed;
            background-color: #a0a0a0;
            border: 2px solid;
            border-color: #000000 #000000 #000000 #000000;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            min-width: 300px;
        }

        .win95-window.active {
            display: block;
        }

        .win95-titlebar {
            background: #ffffff;
            padding: 4px 6px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            text-transform: lowercase;
        }

        .win95-titlebar span {
            flex: 1;
            text-align: left;
            color: #f5f0e8;
        }

        .win95-buttons {
            display: flex;
            gap: 0;
            flex-shrink: 0;
        }

        .win95-btn {
            width: 18px;
            height: 18px;
            background-color: #a0a0a0;
            border: 1px solid;
            border-color: #000000 #000000 #000000 #000000;
            color: #000000;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Courier New", monospace;
        }

        .win95-btn:active {
            border-color: #000000 #000000 #000000 #000000;
        }

        .win95-btn-close {
            position: relative;
            font-size: 0;
        }

        .win95-btn-close::before,
        .win95-btn-close::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 10px;
            background: #000000;
            top: 50%;
            left: 50%;
        }

        .win95-btn-close::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .win95-btn-close::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .win95-btn-close:active::before,
        .win95-btn-close:active::after {
            background: #000000;
        }

        .win95-content {
            padding: 15px;
            background-color: #a0a0a0;
            max-height: 70vh;
            overflow: auto;
            text-transform: lowercase;
        }

        .win95-content img {
            max-width: 100%;
            height: auto;
            display: block;
            border: none;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        .minimized {
            width: 200px !important;
            height: auto !important;
        }

        .minimized .win95-content {
            display: none;
        }

        .link-modal-content {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: flex-start;
        }

        .link-modal-content img {
            max-width: 100%;
            height: auto;
            max-height: 60vh;
            display: block;
            border: 1px solid #808080;
        }

        .win95-window.maximized.link-window .link-modal-content img {
            max-height: 85vh;
        }

    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <!-- Link popups are created dynamically (multiple can be open at once) -->

    <script>
        let draggedElement = null;
        let offsetX = 0;
        let offsetY = 0;
        let isMaximized = {};

        // Make windows draggable
        document.addEventListener('mousedown', function(e) {
            if (e.target.classList.contains('win95-titlebar') || e.target.parentElement.classList.contains('win95-titlebar')) {
                const titlebar = e.target.classList.contains('win95-titlebar') ? e.target : e.target.parentElement;
                draggedElement = titlebar.parentElement;
                const rect = draggedElement.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
            }
        });

        document.addEventListener('mousemove', function(e) {
            if (draggedElement && !draggedElement.classList.contains('minimized')) {
                draggedElement.style.left = (e.clientX - offsetX) + 'px';
                draggedElement.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            draggedElement = null;
        });

        let linkWindowCount = 0;
        function openLinkModal(event, title, imageUrls) {
            event.preventDefault();
            if (!imageUrls || !imageUrls.length) return;
            linkWindowCount++;
            const id = 'linkWindow-' + linkWindowCount;
            const existing = document.querySelectorAll('.win95-window.link-window').length;
            const offset = Math.min(existing * 24, 120);
            const win = document.createElement('div');
            win.className = 'win95-window link-window active';
            win.id = id;
            win.innerHTML =
                '<div class="win95-titlebar">' +
                '<span>' + (title + '.jpg').toLowerCase() + '</span>' +
                '<div class="win95-buttons">' +
                '<div class="win95-btn win95-btn-close" onclick="closeWindow(\'' + id + '\')" title="close"></div>' +
                '</div></div>' +
                '<div class="win95-content link-modal-content"></div>';
            const content = win.querySelector('.win95-content');
            imageUrls.forEach(function(url) {
                const img = document.createElement('img');
                img.src = url;
                img.alt = title;
                content.appendChild(img);
            });
            win.style.left = 'calc(50% + ' + offset + 'px)';
            win.style.top = 'calc(50% + ' + offset + 'px)';
            win.style.transform = 'translate(-50%, -50%)';
            win.style.position = 'fixed';
            document.body.appendChild(win);
            isMaximized[id] = false;
        }

        function closeWindow(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            const isLinkWindow = modal.classList.contains('link-window');
            modal.classList.remove('active');
            modal.classList.remove('minimized');
            if (isLinkWindow) modal.remove();
            const openWindows = document.querySelectorAll('.win95-window.active');
            if (openWindows.length === 0) {
                document.getElementById('overlay').classList.remove('active');
            }
        }

        function closeAll() {
            document.querySelectorAll('.win95-window.link-window').forEach(win => win.remove());
            document.querySelectorAll('.win95-window').forEach(win => {
                win.classList.remove('active');
                win.classList.remove('minimized');
            });
            document.getElementById('overlay').classList.remove('active');
        }

        // Prevent text selection while dragging
        document.addEventListener('selectstart', function(e) {
            if (draggedElement) {
                e.preventDefault();
            }
        });
    </script>
</body>
